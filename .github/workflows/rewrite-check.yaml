# R CMD check of the rewrite (DEC-026, DEC-071; brief §9): Linux, macOS, and Windows with R
# release, devel, and oldrel-1, failing on errors and warnings. Heavy reference cases skip here,
# as on CRAN; rewrite-reference.yaml runs all of them.
#
# The tests compare numbers with the committed reference fixtures only on the platform that
# produced them (DEC-080), Windows x86_64 with R 4.4 (its internal BLAS and LAPACK 3.12.0), which
# the job "fixtures" checks here, with lme4 built from source with the fixture machine's Eigen
# cache sizes (D-53, DEC-094); elsewhere they compare everything but the numbers, and
# rewrite-reference.yaml compares the numbers with fixtures pprof 1.0.3 produces on the platform.
#
# The job with R 4.4.0 on Linux checks the oldest R version DESCRIPTION declares, as the
# "fixtures" job does on Windows (DEC-074, DEC-081).
#
# The jobs marked `minimal` install pprof's hard dependencies and only the suggested packages its
# tests and vignettes need (the tests skip the others), plus Matrix, so that lme4 and Matrix can
# match the fixture manifest: with "all", pak also resolves the suggested packages of rcmdcheck
# and sessioninfo, which need newer R versions than these jobs run (Phase 8, step 1). The job
# "fixtures" adds the suggested packages of the independent-reference tests (`suggested`).
#
# R-devel has no binary packages for macOS, so its job builds every dependency from source;
# data.table, which caret needs, builds only with gettext's libintl, which the job installs
# from CRAN's macOS build where R's toolchain looks for it (/opt/R/arm64).
#
# Every job copies the check's results into annotations (.github/scripts/ci-annotate.R), which
# the public GitHub API returns without signing in.
name: rewrite-check

on:
  push:
    branches: ["main", "rewrite/**", "coxph/**"]
  pull_request:
    branches: ["main", "rewrite/**", "coxph/**"]
  workflow_dispatch:

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})${{ matrix.config.fixtures && ', fixtures' || '' }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-24.04, r: "release"}
          - {os: ubuntu-24.04, r: "devel", http-user-agent: "release"}
          - {os: ubuntu-24.04, r: "oldrel-1"}
          - {os: macos-latest, r: "release"}
          - {os: macos-latest, r: "devel"}
          - {os: macos-latest, r: "oldrel-1"}
          - {os: windows-latest, r: "release"}
          - {os: windows-latest, r: "devel"}
          - {os: windows-latest, r: "oldrel-1"}
          - {os: windows-latest, r: "4.4.0", fixtures: true, minimal: true, suggested: true}
          - {os: ubuntu-24.04, r: "4.4.0", minimal: true}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      EXTRA_PACKAGES: ${{ matrix.config.minimal && format('any::rcmdcheck, any::testthat, any::withr, any::jsonlite, any::knitr, any::rmarkdown, any::Matrix{0}', matrix.config.suggested && ', any::pROC, any::logistf, any::caret, any::olsrr' || '') || 'any::rcmdcheck' }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install gettext for source builds (macOS, R-devel)
        if: runner.os == 'macOS' && matrix.config.r == 'devel'
        run: curl -fsSL https://mac.r-project.org/bin/darwin23/arm64/gettext-0.22.5-darwin.23-arm64.tar.xz | sudo tar -xJf - -C /

      - uses: r-lib/actions/setup-r-dependencies@v2
        id: dependencies
        continue-on-error: true
        with:
          extra-packages: ${{ env.EXTRA_PACKAGES }}
          dependencies: ${{ matrix.config.minimal && '"hard"' || '"all"' }}
          needs: check

      # The action's own log is not readable without signing in.
      - name: Report a failure to install the dependencies
        if: steps.dependencies.outcome == 'failure'
        run: |
          Rscript .github/scripts/ci-annotate.R dependencies ${{ matrix.config.minimal && 'Config/Needs/check,hard' || 'Config/Needs/check,all' }} FALSE deps::. any::sessioninfo "${{ env.EXTRA_PACKAGES }}"
          exit 1

      # The job "fixtures" compares the lme4-backed cases with the fixtures when lme4 and Matrix
      # match the manifest. Eigen sizes the blocks of lme4's matrix products from the L1 cache it
      # reads from the processor, so CRAN's lme4 binary reproduces the fixtures only on runners
      # with the 48 KB L1 cache of the machine that made them (D-53). lme4 is rebuilt here from
      # source with the cache query off and that machine's cache sizes, as rewrite-reference.yaml's
      # fixture-platform job builds it (DEC-094).
      - name: Build lme4 with the fixture machine's cache sizes
        if: matrix.config.fixtures
        shell: Rscript {0}
        run: |
          makevars <- file.path(tempdir(), "Makevars-lme4")
          writeLines(paste("CPPFLAGS += -DEIGEN_NO_CPUID -DEIGEN_DEFAULT_L1_CACHE_SIZE=49152",
                           "-DEIGEN_DEFAULT_L2_CACHE_SIZE=1310720 -DEIGEN_DEFAULT_L3_CACHE_SIZE=8388608"), makevars)
          Sys.setenv(R_MAKEVARS_USER = makevars)
          # lme4 compiles against the headers of its LinkingTo packages (RcppEigen), which its
          # binary does not need and the dependency step does not install.
          db <- utils::available.packages(type = "source")
          linking <- tools::package_dependencies("lme4", db = db, which = "LinkingTo")[[1]]
          missing <- setdiff(linking, rownames(utils::installed.packages()))
          if (length(missing)) utils::install.packages(missing)
          tarball <- utils::download.packages("lme4", destdir = tempdir(), type = "source")[1, 2]
          lib <- .libPaths()[1]
          log <- system2(file.path(R.home("bin"), "R"), c("CMD", "INSTALL", "--preclean", paste0("--library=", lib), tarball),
                         stdout = TRUE, stderr = TRUE)
          if (!is.null(attr(log, "status")) || !any(grepl("EIGEN_NO_CPUID", log))) {
            writeLines(log)
            # The job log needs signing in; the annotation is public.
            cat("::error title=Building lme4 failed::", paste(gsub("[\r\n]+", " ", tail(log, 12)), collapse = "%0A"),
                "\n", sep = "")
            stop("Building lme4 from source with fixed Eigen cache sizes failed.")
          }
          if (!startsWith(normalizePath(find.package("lme4"), winslash = "/"), normalizePath(lib, winslash = "/"))) {
            stop("lme4 does not load from ", lib, ", where it was built.")
          }
          manifest <- jsonlite::read_json("tests/testthat/fixtures/reference/manifest.json")
          wanted <- manifest$numerically_relevant_packages
          cat(sprintf("::notice title=lme4 built from source::lme4 %s and Matrix %s (fixture manifest: %s and %s), built with %s\n",
                      utils::packageVersion("lme4"), utils::packageVersion("Matrix"), wanted$lme4, wanted$Matrix,
                      sub("^CPPFLAGS \\+= ", "", readLines(makevars))))

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          upload-snapshots: true

      - name: Report the check in annotations
        if: always()
        run: Rscript .github/scripts/ci-annotate.R check check
