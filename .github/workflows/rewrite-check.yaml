# R CMD check of the rewrite (DEC-026, DEC-071; brief §9): Linux, macOS, and Windows with R
# release, devel, and oldrel-1, failing on errors and warnings. Heavy reference cases skip here,
# as on CRAN; rewrite-reference.yaml runs all of them.
#
# The jobs marked `probe` look for the lowest R version the package works with (DEC-074): they
# do not fail the workflow, and they leave the matrix once DESCRIPTION states that version.
#
# Every job copies the check's results into annotations (.github/scripts/ci-annotate.R), which
# the public GitHub API returns without signing in.
name: rewrite-check

on:
  push:
    branches: ["main", "rewrite/**"]
  pull_request:
    branches: ["main", "rewrite/**"]
  workflow_dispatch:

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    continue-on-error: ${{ matrix.config.probe == true }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-24.04, r: "release"}
          - {os: ubuntu-24.04, r: "devel", http-user-agent: "release"}
          - {os: ubuntu-24.04, r: "oldrel-1"}
          - {os: macos-latest, r: "release"}
          - {os: macos-latest, r: "devel"}
          - {os: macos-latest, r: "oldrel-1"}
          - {os: windows-latest, r: "release"}
          - {os: windows-latest, r: "devel"}
          - {os: windows-latest, r: "oldrel-1"}
          - {os: ubuntu-24.04, r: "oldrel-2", probe: true}
          - {os: ubuntu-24.04, r: "oldrel-3", probe: true}
          - {os: ubuntu-24.04, r: "oldrel-4", probe: true}
          - {os: ubuntu-24.04, r: "4.1", probe: true}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # The probes install pprof's hard dependencies and only the suggested packages its tests
      # and vignettes need (the tests skip the others): with "all", pak also resolves the
      # suggested packages of rcmdcheck and sessioninfo, which need newer R versions than the
      # one probed (Phase 8, step 1).
      - uses: r-lib/actions/setup-r-dependencies@v2
        id: dependencies
        continue-on-error: true
        with:
          extra-packages: ${{ matrix.config.probe && 'any::rcmdcheck, any::testthat, any::withr, any::jsonlite, any::knitr, any::rmarkdown' || 'any::rcmdcheck' }}
          dependencies: ${{ matrix.config.probe && '"hard"' || '"all"' }}
          needs: check

      # The action's own log is not readable without signing in.
      - name: Report a failure to install the dependencies
        if: steps.dependencies.outcome == 'failure'
        run: |
          Rscript .github/scripts/ci-annotate.R dependencies ${{ matrix.config.probe && 'Config/Needs/check,hard' || 'Config/Needs/check,all' }} FALSE deps::. any::sessioninfo ${{ matrix.config.probe && 'any::rcmdcheck any::testthat any::withr any::jsonlite any::knitr any::rmarkdown' || 'any::rcmdcheck' }}
          exit 1

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          upload-snapshots: true

      - name: Report the check in annotations
        if: always()
        run: Rscript .github/scripts/ci-annotate.R check check
