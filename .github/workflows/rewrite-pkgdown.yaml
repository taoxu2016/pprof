# Builds the pkgdown site of the rewrite branches and keeps it as an artifact (DEC-066).
# Publishing the site is the package owners' decision, so this workflow deploys nothing.
name: rewrite-pkgdown

on:
  push:
    branches: ["rewrite/**"]
  pull_request:
    branches: ["rewrite/**"]
  workflow_dispatch:

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Check the configuration
        run: pkgdown::check_pkgdown()
        shell: Rscript {0}

      # pkgdown renders every Markdown file at the root of the repository; the notes for
      # Claude Code are not part of the site.
      - name: Leave CLAUDE.md out of the site
        run: rm -f CLAUDE.md CLAUDE.local.md

      - name: Build the site
        run: pkgdown::build_site(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - uses: actions/upload-artifact@v4
        with:
          name: pkgdown-site
          path: docs
