# Test coverage of the rewrite (DEC-026, DEC-071; brief §6, criterion 9): R and C++ line coverage
# reported separately, failing below 90% of the R lines. Reported in the job log and in an
# annotation; no upload service. Failing tests are copied into annotations
# (.github/scripts/ci-annotate.R).
name: rewrite-coverage

on:
  push:
    branches: ["main", "rewrite/**"]
  pull_request:
    branches: ["main", "rewrite/**"]
  workflow_dispatch:

permissions: read-all

jobs:
  coverage:
    runs-on: ubuntu-24.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Coverage
        shell: Rscript {0}
        run: |
          source(".github/scripts/ci-annotate.R")
          coverage <- tryCatch(covr::package_coverage(quiet = FALSE, clean = FALSE), error = function(e) {
            fails <- list.files(tempdir(), "testthat\\.Rout\\.fail$", recursive = TRUE, full.names = TRUE)
            for (f in fails) annotate_rout(f)
            if (!length(fails)) annotate("error", "Coverage", c(conditionMessage(e), platform()))
            stop(e)
          })
          print(coverage, group = "filename")
          lines <- covr::tally_coverage(coverage, by = "line")
          share <- function(rows) 100 * mean(rows$value > 0)
          r_lines <- lines[startsWith(lines$filename, "R/"), ]
          cpp_lines <- lines[startsWith(lines$filename, "src/"), ]
          report <- c(sprintf("Total: %.2f%%", covr::percent_coverage(coverage)),
                      sprintf("R: %.2f%% of %d lines", share(r_lines), nrow(r_lines)),
                      sprintf("C++: %.2f%% of %d lines", share(cpp_lines), nrow(cpp_lines)))
          cat("\n", paste(report, collapse = "\n"), "\n", sep = "")
          annotate("notice", "Coverage", c(report, platform()))
          if (share(r_lines) < 90) {
            annotate("error", "Coverage below 90% of R lines", report)
            quit(status = 1L)
          }
