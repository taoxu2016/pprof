# Test coverage of the rewrite branches (DEC-026; brief §6). Reported in the job log; no
# upload service.
name: rewrite-coverage

on:
  push:
    branches: ["rewrite/**"]
  pull_request:
    branches: ["rewrite/**"]
  workflow_dispatch:

permissions: read-all

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Coverage
        shell: Rscript {0}
        run: |
          coverage <- covr::package_coverage(quiet = FALSE)
          print(coverage, group = "filename")
          cat(sprintf("\nTotal coverage: %.1f%%\n", covr::percent_coverage(coverage)))
