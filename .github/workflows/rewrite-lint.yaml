# Style checks of the rewrite (DEC-031, DEC-071; brief §9): lintr with the repository's .lintr,
# failing on any lint. lintr reports each lint as an annotation when it runs in GitHub Actions.
name: rewrite-lint

on:
  push:
    branches: ["main", "rewrite/**"]
  pull_request:
    branches: ["main", "rewrite/**"]
  workflow_dispatch:

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-24.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, local::.
          needs: lint

      - name: lintr
        shell: Rscript {0}
        run: |
          lints <- lintr::lint_package()
          print(lints)
          if (length(lints)) {
            cat(sprintf("::error title=lintr::%d lints\n", length(lints)))
            quit(status = 1L)
          }
          cat("::notice title=lintr::no lints\n")
